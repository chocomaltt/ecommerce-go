syntax = "proto3";

package order.v1;

option go_package = "github.com/chocomaltt/ecommerce-go/common-rpc/gen/order/v1;orderv1";

message GetCallerRequest {}

message GetCallerResponse {
  string user_id = 1;
  string caller_service = 2;
  string email = 3;
}

service OrderIdentityService {
  rpc GetCaller(GetCallerRequest) returns (GetCallerResponse);
}
