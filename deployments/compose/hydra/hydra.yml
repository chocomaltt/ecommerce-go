serve:
  cookies:
    same_site_mode: Lax
  public:
    port: 4444
  admin:
    port: 4445

urls:
  self:
    issuer: http://localhost:4444
  # edge-api implements Hydra's login/consent app interface (headless, JSON).
  login: http://host.docker.internal:8080/auth/hydra/login
  consent: http://host.docker.internal:8080/auth/hydra/consent
  logout: http://host.docker.internal:8080/auth/hydra/logout

dsn: postgres://postgres:postgres@postgres:5432/hydra?sslmode=disable

secrets:
  system:
    - youReallyNeedToChangeThis32CharOrLonger

oidc:
  subject_identifiers:
    supported_types:
      - public
      - pairwise
    pairwise:
      salt: youReallyNeedToChangeThis32CharOrLonger

log:
  level: info
